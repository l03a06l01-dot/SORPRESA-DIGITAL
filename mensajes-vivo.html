<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes Estelares ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow-y: auto !important; 
            height: auto;
            min-height: 100vh;
            padding: 40px 20px;
            display: block; 
        }

        .messages-page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .messages-page-title h1 {
            color: #ff4b5c;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #messages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

        /* --- ESTILO DE LA TARJETA EXPANDIBLE --- */
        .message-card {
            background: rgba(255, 255, 255, 0.95);
            border-left: 6px solid #ff4b5c;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            
            /* Estado inicial: cerrado */
            max-height: 80px; 
            overflow: hidden;
            cursor: pointer;
        }

        /* Título del mensaje (siempre visible) */
        .message-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff4b5c;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .message-title::after {
            content: '▼'; /* Flecha indicadora */
            font-size: 0.8rem;
            transition: transform 0.5s;
        }

        /* Texto del mensaje (oculto inicialmente) */
        .message-text {
            color: #333;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-date {
            font-size: 0.8rem;
            color: #999;
            margin-top: 15px;
            text-align: right;
            display: block;
        }

        /* --- EFECTO HOVER (CUANDO PASAS EL MOUSE) --- */
        .message-card:hover {
            max-height: 1000px; /* Se expande para mostrar todo */
            box-shadow: 0 15px 30px rgba(255, 75, 92, 0.3);
            background: #ffffff;
            transform: translateY(-5px);
        }

        .message-card:hover .message-title::after {
            transform: rotate(180deg); /* La flecha gira */
        }

        .message-card:hover .message-text {
            opacity: 1; /* El texto aparece suavemente */
        }

        .footer-nav { text-align: center; padding-bottom: 40px; }
    </style>
</head>
<body>
    <div id="main-background-image" class="bg-floral"></div> 
    <div id="background"></div>
    <div id="particles"></div>

    <div class="messages-page-title">
        <h1>Mensajes para Ti ❤️</h1>
        <p style="color: white; font-weight: 600; text-shadow: 1px 1px 2px black;">Pasa el mouse sobre un mensaje para expandirlo.</p>
    </div>
    
    <div id="messages-grid">
        <p style="color: white; text-align: center; grid-column: 1/-1;">Sincronizando mensajes...</p>
    </div>

    <div class="footer-nav">
        <a href="menu.html" class="back-to-menu-button">Volver al Menú Principal 🚀</a>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby2z5snwfrRisjRNO_pir-P_kLkecSnQ2upj4OrEblSd2XW95HSXT12i_kZq_QdaMSc/exec'; 

        async function fetchMessages() {
            const grid = document.getElementById('messages-grid');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                grid.innerHTML = '';

                if (data.length === 0) {
                    grid.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No hay mensajes aún.</p>';
                    return;
                }

                // Invertimos para que el último mensaje de Excel sea el "Mensaje 1"
                data.reverse().forEach((msg, index) => {
                    const card = document.createElement('div');
                    card.className = 'message-card';

                    let fechaLabel = "Recién llegado ✨";
                    if (msg.infoAdicional && msg.infoAdicional.trim() !== "") {
                        const d = new Date(msg.infoAdicional);
                        fechaLabel = isNaN(d.getTime()) ? msg.infoAdicional : d.toLocaleDateString();
                    }

                    // Aquí creamos la estructura: Título (Mensaje X) + Contenido
                    card.innerHTML = `
                        <div class="message-title">Mensaje ${index + 1}</div>
                        <div class="message-text">${msg.contenido}</div>
                        <span class="message-date">${fechaLabel}</span>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                grid.innerHTML = '<p style="color: white;">Error al conectar con el servidor.</p>';
            }
        }

        fetchMessages();
        setInterval(fetchMessages, 60000);
    </script>
</body>
</html>
