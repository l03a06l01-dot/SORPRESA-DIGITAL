<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist que Me Recuerda a Ti 🎶</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .playlist-container {
            text-align: center;
            max-width: 900px;
            padding: 40px;
            /* Usamos un fondo claro para mejor legibilidad de las tarjetas de música */
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            color: #333; /* Texto oscuro */
        }
        .playlist-container h1 {
            color: #ff4b5c; /* Rosa de tu tema */
            text-shadow: none;
            margin-bottom: 25px;
        }
        .playlist-container p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        #playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .embed-card {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .embed-card iframe {
            width: 100%;
            height: 315px; /* Altura estándar para reproductores */
            border: none;
        }
    </style>
</head>
<body>
    <div id="main-background-image" class="bg-floral"></div> 
    <div id="background"></div>
    <div id="particles"></div>

    <div class="container playlist-container">
        <h1>Canciones que Me Hacen Pensar en Ti ❤️</h1>
        <p>Esta playlist se actualiza automáticamente desde mi celular. ¡Disfruta la música!</p>
        
        <div id="playlist-grid">
            <p style="color: #666;">Cargando playlist...</p>
        </div>

        <a href="menu.html" class="back-to-menu-button">Volver al Menú Principal 🚀</a>
    </div>

    <audio id="bgMusic" src="musica5.mp3" loop autoplay></audio>
    <script>
        const bgMusic = document.getElementById("bgMusic");
        bgMusic.play().catch(() => {});
        
        // ⚠️ REEMPLAZA ESTA URL con la URL de tu Apps Script para la playlist.
        const API_PLAYLIST_URL = https://script.google.com/macros/s/AKfycby8drTc25-SyB7T8ur8V8XonrmmgDay6IM9LO6U4Fx1CjfzAb_6zVMXEA305uDHh0jRpw/exec; 
        
        const playlistGrid = document.getElementById('playlist-grid');

        // Función para convertir URLs comunes de YouTube/Spotify en formato embed (iframe)
        function getEmbedUrl(url) {
            if (!url) return null;
            
            // 1. YouTube estándar: https://www.youtube.com/watch?v=ID -> https://www.youtube.com/embed/ID
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]+)/i);
            if (ytMatch && ytMatch[1]) {
                return `https://www.youtube.com/embed/${ytMatch[1]}`;
            }
            
            // 2. Spotify: Pega el enlace de COMPARTIR, NO el enlace de incrustación HTML.
            // Ej: https://open.spotify.com/track/ID?si=... -> https://open.spotify.com/embed/track/ID
            const spMatch = url.match(/(open\.spotify\.com\/(?:track|album|playlist)\/[a-zA-Z0-9]+)/);
            if (spMatch) {
                return `https://open.spotify.com/embed/${spMatch[1].replace('open.spotify.com/', '')}`;
            }

            // Si el link ya está en formato embed o es otra cosa, lo devuelve tal cual.
            return url;
        }

        async function fetchPlaylist() {
            playlistGrid.innerHTML = '';
            
            try {
                const response = await fetch(API_PLAYLIST_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const links = await response.json();
                
                if (links.length === 0 || links.every(link => !link.trim())) {
                    playlistGrid.innerHTML = '<p style="color: #999;">Aún no hay canciones en la playlist. ¡Añade algunas a la hoja de cálculo!</p>';
                    return;
                }

                links.forEach(link => {
                    const embedUrl = getEmbedUrl(link.trim());
                    
                    if (embedUrl) {
                        const embedCode = `
                            <div class="embed-card">
                                <iframe 
                                    src="${embedUrl}" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                                ></iframe>
                            </div>
                        `;
                        playlistGrid.insertAdjacentHTML('beforeend', embedCode);
                    }
                });

            } catch (error) {
                console.error("Error al cargar la playlist:", error);
                playlistGrid.innerHTML = '<p style="color: red;">Error al cargar la playlist. Verifica la URL de la API y los permisos.</p>';
            }
        }

        fetchPlaylist();
    </script>
</body>
</html>
