<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist que Me Recuerda a Ti 🎶</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .playlist-container {
            text-align: center;
            max-width: 900px;
            padding: 40px;
            /* Usamos un fondo CLARO para mejor legibilidad de las tarjetas de música */
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            color: #333; /* Texto oscuro */
            
            /* Ajuste para centrar el botón de regreso */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .playlist-container h1 {
            color: #ff4b5c; /* Rosa de tu tema (Ahora visible sobre blanco) */
            text-shadow: 0 0 5px rgba(255, 75, 92, 0.5); /* Sombra para el título */
            margin-bottom: 25px;
            font-size: 3.5rem; /* Asegurar tamaño grande */
        }
        .playlist-container p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        /* --- MODIFICACIÓN CLAVE: GRID RESPONSIVO --- */
        #playlist-grid {
            width: 100%; 
            display: grid;
            /* Permite que los videos sean más pequeños en móviles (mínimo 280px) */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .embed-card {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* --- MODIFICACIÓN CLAVE: MANTENER ASPECT RATIO 16:9 --- */
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%; /* (9 / 16) * 100 = 56.25% (Proporción 16:9) */
            height: 0;
            overflow: hidden;
        }

        .embed-card iframe {
            /* Ocupa el 100% del contenedor responsive */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* ---------------------------------------------------- */
    </style>
</head>
<body>
    <div id="main-background-image" class="bg-floral"></div> 
    <div id="background"></div>
    <div id="particles"></div>

    <div class="container playlist-container dark-text">
        <h1>Canciones que Me Hacen Pensar en Ti ❤️</h1>
        <p>Esta playlist se actualiza automáticamente desde mi celular. ¡Disfruta la música!</p>
        
        <div id="playlist-grid">
            <p style="color: #666;">Cargando playlist...</p>
        </div>

        <a href="menu.html" class="back-to-menu-button">Volver al Menú Principal 🚀</a>
    </div>

    <audio id="bgMusic" src="musica0.mp3" loop autoplay></audio>
    <script>
        const bgMusic = document.getElementById("bgMusic");
        bgMusic.play().catch(() => {});
        
        // URL de la API de la Playlist (VERIFICADA)
        const API_PLAYLIST_URL = 'https://script.google.com/macros/s/AKfycby8drTc25-SyB7T8ur8V8XonrmmgDay6IM9LO6U4Fx1CjfzAb_6zVMXEA305uDHh0jRpw/exec'; 
        
        const playlistGrid = document.getElementById('playlist-grid');

        // Función para convertir URLs comunes de YouTube/Spotify en formato embed (iframe)
        function getEmbedUrl(url) {
            if (!url) return null;
            
            // Expresión regular robusta para obtener el ID de YouTube
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?#]+)/i);
            if (ytMatch && ytMatch[1]) {
                return `https://www.youtube.com/embed/${ytMatch[1]}?controls=1&showinfo=0&rel=0`;
            }
            
            // Lógica para Spotify
            const spMatch = url.match(/(open\.spotify\.com\/(?:track|album|playlist)\/[a-zA-Z0-9]+)/);
            if (spMatch) {
                const parts = spMatch[1].split('/');
                const type = parts[1];
                const id = parts[2];
                // Formato embed URI de Spotify
                return `https://open.spotify.com/embed/track/ID1{type}:${id}`;
            }

            return url;
        }

        async function fetchPlaylist() {
            playlistGrid.innerHTML = '<p style="color: #666;">Cargando playlist...</p>';
            
            try {
                const response = await fetch(API_PLAYLIST_URL);
                
                if (!response.ok) {
                    if (response.status === 403) {
                         throw new Error(`Error 403: Acceso denegado. Verifica los permisos del Apps Script ("Cualquiera").`);
                    }
                    throw new Error(`Error HTTP! estado: ${response.status}`);
                }
                
                const links = await response.json();
                
                playlistGrid.innerHTML = '';
                
                const validLinks = links.filter(link => link && link.trim());

                if (validLinks.length === 0) {
                    playlistGrid.innerHTML = '<p style="color: #999;">Aún no hay canciones en la playlist. ¡Añade algunas a la hoja de cálculo!</p>';
                    return;
                }

                validLinks.forEach(link => {
                    const embedUrl = getEmbedUrl(link.trim());
                    
                    if (embedUrl) {
                        const isSpotify = embedUrl.includes('https://open.spotify.com/embed/track/ID2');
                        
                        // Contenedor video-responsive para mantener el aspect ratio 16:9
                        const embedCode = `
                            <div class="embed-card">
                                <div class="video-responsive">
                                    <iframe 
                                        src="${embedUrl}" 
                                        frameborder="0"
                                        allowtransparency="true"
                                        allow="encrypted-media; fullscreen"
                                    ></iframe>
                                </div>
                            </div>
                        `;
                        playlistGrid.insertAdjacentHTML('beforeend', embedCode);
                    }
                });

            } catch (error) {
                console.error("Error al cargar la playlist:", error);
                playlistGrid.innerHTML = `<p style="color: red;">¡Error de Conexión! Detalle: ${error.message}. 
                                        Verifica la URL, los permisos del Apps Script y que la columna A se llame LINK.</p>`;
            }
        }

        fetchPlaylist();
    </script>
</body>
</html>
